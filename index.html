<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fff4e8">
<title>With love | Shefali &amp; Ansh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:48px 24px;background:radial-gradient(ellipse at 5% 10%,#fcdcc9 0,transparent 46%),radial-gradient(ellipse at 95% 85%,#e0ebd7 0,transparent 45%),#fff4e8;color:#394a40;font-family:'Montserrat',sans-serif}
body:before,body:after{content:"";position:fixed;width:240px;height:240px;border:1px solid #bcbf9160;border-radius:50%;z-index:-1;pointer-events:none}
body:before{left:-130px;top:20%}body:after{right:-100px;bottom:5%;width:330px;height:330px}
.card{position:relative;display:grid;grid-template-columns:.95fr 1.05fr;width:min(100%,960px);overflow:hidden;background:#fffdf8;border:1px solid #fff;border-radius:28px;box-shadow:0 24px 80px #82614c16}
.photo{position:relative;min-height:610px;margin:0;background:#d5e7db}
.photo img{display:block;width:100%;height:100%;position:absolute;inset:0;object-fit:cover;object-position:50% 65%}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#153d3555,transparent 38%)}
.photo figcaption{position:absolute;bottom:25px;left:0;right:0;color:white;text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;z-index:1}
.copy{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 42px}
.monogram{font-family:'Great Vibes',cursive;color:#ba8357;font-size:44px;line-height:1;margin:0 0 30px}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#8a7b61;margin:0 0 20px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(40px,5vw,56px);font-weight:500;line-height:1.04;letter-spacing:-.025em;margin:0;color:#3f5846}
h1 em{font-weight:400;color:#b57658}
.flourish{display:flex;align-items:center;gap:13px;margin:28px 0;color:#bd9861}
.flourish:before,.flourish:after{content:"";width:42px;height:1px;background:#dccaac}
.flourish span{width:8px;height:8px;display:block;transform:rotate(45deg);border:1px solid #bd9861}
.message{max-width:310px;font-size:13px;line-height:1.9;color:#706e62;margin:0}
.thanks{max-width:300px;font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-style:italic;line-height:1.35;margin:20px 0 0;color:#65745b}
.signoff{margin-top:36px}
.signoff p{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8a7b61;margin:0 0 10px}
.names{font-family:'Great Vibes',cursive;font-size:35px;color:#a56a50;line-height:1.4}
.petal{position:absolute;pointer-events:none;width:17px;height:30px;border-radius:90% 0 90% 0;background:#efc5ad70}
.p1{top:30px;right:30px;transform:rotate(20deg)}
.p2{bottom:42px;left:27px;transform:rotate(85deg);background:#c9d7b580;width:13px;height:24px}
@media(max-width:680px){body{padding:22px 16px}.card{max-width:440px;grid-template-columns:1fr;border-radius:24px}.photo{min-height:0;height:320px}.photo img{object-position:50% 62%}.photo figcaption{bottom:18px;font-size:9px}.copy{padding:38px 28px 42px}.monogram{font-size:36px;margin-bottom:23px}h1{font-size:45px}.eyebrow{font-size:9px;margin-bottom:16px}.flourish{margin:22px 0}.signoff{margin-top:28px}.names{font-size:33px}}
@media(max-width:360px){.photo{height:280px}.copy{padding:32px 20px}h1{font-size:39px}}
</style>
</head>
<body>
<main class="card">
<figure class="photo"><img src="assts/closing-couple-v2.webp" alt="Shefali and Ansh together under a tree on a sunny day" width="900" height="1350" fetchpriority="high"><figcaption>A little love, a lifetime of memories</figcaption></figure>
<section class="copy" aria-labelledby="closed-heading">
<span class="petal p1" aria-hidden="true"></span><span class="petal p2" aria-hidden="true"></span>
<p class="monogram" aria-label="S and A">S &amp; A</p>
<p class="eyebrow">With love, from us</p>
<h1 id="closed-heading">RSVPs have<br><em>now closed</em></h1>
<div class="flourish" aria-hidden="true"><span></span></div>
<p class="message">The RSVP window for this invitation has ended.</p>
<p class="thanks">Thank you for being part of our story.</p>
<div class="signoff"><p>With love</p><div class="names">Shefali &amp; Ansh</div></div>
</section>
</main>
</body>
</html>
